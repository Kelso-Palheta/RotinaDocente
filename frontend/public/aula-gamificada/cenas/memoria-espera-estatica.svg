<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Cartas embaralhadas em espera">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      .cena-mov { transform-origin: 240px 135px; animation: none; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="115" y="75" width="90" height="125" rx="12" fill="#0EA5E9" stroke="#38BDF8" stroke-width="4" transform="rotate(-10 160 137)"/><rect x="195" y="65" width="90" height="125" rx="12" fill="#0F2942" stroke="#FDE047" stroke-width="4"/><rect x="275" y="75" width="90" height="125" rx="12" fill="#0EA5E9" stroke="#38BDF8" stroke-width="4" transform="rotate(10 320 137)"/></g>
</svg>
