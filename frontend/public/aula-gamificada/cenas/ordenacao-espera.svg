<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Sequência de passos aguardando montagem">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1810"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="85" y="105" width="68" height="68" rx="12" fill="#EA580C" stroke="#FDE047" stroke-width="4"/><rect x="170" y="105" width="68" height="68" rx="12" fill="#EA580C" stroke="#FB923C" stroke-width="4"/><rect x="255" y="105" width="68" height="68" rx="12" fill="#EA580C" stroke="#FDE047" stroke-width="4"/><rect x="340" y="105" width="68" height="68" rx="12" fill="#EA580C" stroke="#FB923C" stroke-width="4"/></g>
</svg>
