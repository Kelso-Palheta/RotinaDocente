<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Pódio cooperativo com fogos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#271033"/>
      <stop offset="100%" stop-color="#DB2777" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      .cena-mov { transform-origin: 240px 135px; animation: none; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="95" y="150" width="90" height="85" rx="8" fill="#38BDF8"/><rect x="195" y="105" width="90" height="130" rx="8" fill="#FACC15"/><rect x="295" y="135" width="90" height="100" rx="8" fill="#DB2777"/><circle cx="240" cy="58" r="16" fill="#FACC15"/><circle cx="140" cy="65" r="10" fill="#FFFFFF"/><circle cx="340" cy="65" r="10" fill="#38BDF8"/></g>
</svg>
