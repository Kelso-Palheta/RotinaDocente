<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Foco visual memorizando posições">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><path d="M90 135 Q240 45 390 135 Q240 225 90 135 Z" fill="#0F2942" stroke="#38BDF8" stroke-width="6"/><circle cx="240" cy="135" r="36" fill="#FDE047"/><circle cx="240" cy="135" r="16" fill="#0F2942"/></g>
</svg>
