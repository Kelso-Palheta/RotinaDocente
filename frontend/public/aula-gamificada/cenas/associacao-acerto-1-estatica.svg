<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Feixe luminoso unindo os pares corretos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132A2E"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0% { transform: scale(0.88); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
      .cena-mov { transform-origin: 240px 135px; animation: none; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="85" y="75" width="105" height="46" rx="10" fill="#2DD4BF"/><rect x="290" y="75" width="105" height="46" rx="10" fill="#FACC15"/><line x1="190" y1="98" x2="290" y2="98" stroke="#FFFFFF" stroke-width="8"/><rect x="85" y="155" width="105" height="46" rx="10" fill="#FACC15"/><rect x="290" y="155" width="105" height="46" rx="10" fill="#2DD4BF"/><line x1="190" y1="178" x2="290" y2="178" stroke="#FFFFFF" stroke-width="8"/></g>
</svg>
