<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Nós de conexão aguardando ligação">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132A2E"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><circle cx="130" cy="85" r="24" fill="#2DD4BF"/><circle cx="130" cy="185" r="24" fill="#0D9488"/><circle cx="350" cy="85" r="24" fill="#0D9488"/><circle cx="350" cy="185" r="24" fill="#FACC15"/><line x1="154" y1="85" x2="326" y2="185" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="8 8"/></g>
</svg>
