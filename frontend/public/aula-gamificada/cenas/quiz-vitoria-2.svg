<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Coroa dourada do campeão do quiz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1145"/>
      <stop offset="100%" stop-color="#6315D9" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><polygon points="120,195 140,85 200,140 240,65 280,140 340,85 360,195" fill="#FFDF00" stroke="#FFFFFF" stroke-width="4"/><rect x="120" y="200" width="240" height="24" rx="8" fill="#00DDEB"/><circle cx="240" cy="65" r="10" fill="#00DDEB"/></g>
</svg>
