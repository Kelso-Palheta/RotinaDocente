<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Quadro tático para próxima rodada">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#271033"/>
      <stop offset="100%" stop-color="#DB2777" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="95" y="60" width="290" height="155" rx="14" fill="#271033" stroke="#38BDF8" stroke-width="5"/><circle cx="155" cy="155" r="14" fill="#FACC15"/><path d="M169 145 Q240 85 320 115" fill="none" stroke="#38BDF8" stroke-width="5" stroke-dasharray="8 6"/><polygon points="325,118 308,105 312,126" fill="#38BDF8"/></g>
</svg>
