<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Holofotes do programa de perguntas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1145"/>
      <stop offset="100%" stop-color="#6315D9" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><polygon points="80,260 210,40 270,40 400,260" fill="#6315D9" opacity="0.28"/><rect x="150" y="75" width="180" height="120" rx="18" fill="#1E1145" stroke="#FFDF00" stroke-width="5"/><text x="240" y="155" text-anchor="middle" font-size="64" font-weight="900" fill="#FFDF00" font-family="sans-serif">?</text></g>
</svg>
