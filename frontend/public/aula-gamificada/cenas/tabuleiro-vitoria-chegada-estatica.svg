      <stop offset="0%" stop-color="#16261E"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0% { transform: scale(0.88); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
