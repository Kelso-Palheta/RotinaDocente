<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Dado e trilha de casas do tabuleiro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16261E"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="115" y="80" width="95" height="95" rx="18" fill="#FFFFFF" stroke="#FDE047" stroke-width="5"/><circle cx="145" cy="110" r="8" fill="#16261E"/><circle cx="180" cy="110" r="8" fill="#16261E"/><circle cx="162" cy="128" r="8" fill="#16261E"/><circle cx="145" cy="146" r="8" fill="#16261E"/><circle cx="180" cy="146" r="8" fill="#16261E"/><rect x="255" y="100" width="115" height="60" rx="12" fill="#16A34A" stroke="#FDE047" stroke-width="4"/><polygon points="295,115 335,130 295,145" fill="#FDE047"/></g>
</svg>
