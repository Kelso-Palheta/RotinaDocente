<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Peças encaixadas em ponte perfeita">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132A2E"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><path d="M100 110 H210 V140 H100 Z" fill="#2DD4BF"/><path d="M210 110 H270 V140 H210 Z" fill="#FACC15"/><path d="M270 110 H380 V140 H270 Z" fill="#2DD4BF"/><circle cx="240" cy="125" r="28" fill="none" stroke="#FFFFFF" stroke-width="5"/></g>
</svg>
