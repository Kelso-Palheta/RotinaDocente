<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Cascata de pares combinados">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      .cena-mov { transform-origin: 240px 135px; animation: none; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="100" y="95" width="80" height="110" rx="10" fill="#0EA5E9" stroke="#FDE047" stroke-width="4"/><rect x="165" y="75" width="80" height="110" rx="10" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/><rect x="235" y="55" width="80" height="110" rx="10" fill="#FDE047" stroke="#FFFFFF" stroke-width="4"/><rect x="300" y="85" width="80" height="110" rx="10" fill="#0EA5E9" stroke="#38BDF8" stroke-width="4"/></g>
</svg>
