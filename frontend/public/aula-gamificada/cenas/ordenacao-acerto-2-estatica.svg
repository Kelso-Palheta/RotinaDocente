<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Engrenagens girando em sincronia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1810"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      .cena-mov { transform-origin: 240px 135px; animation: none; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><circle cx="185" cy="135" r="50" fill="none" stroke="#FDE047" stroke-width="14" stroke-dasharray="18 10"/><circle cx="295" cy="135" r="42" fill="none" stroke="#FB923C" stroke-width="12" stroke-dasharray="14 9"/><circle cx="185" cy="135" r="16" fill="#FDE047"/><circle cx="295" cy="135" r="14" fill="#FB923C"/></g>
</svg>
