<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Circuito fechado com medalha central">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132A2E"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      .cena-mov { transform-origin: 240px 135px; animation: none; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="95" y="75" width="290" height="120" rx="24" fill="none" stroke="#2DD4BF" stroke-width="8"/><circle cx="240" cy="135" r="44" fill="#FACC15" stroke="#FFFFFF" stroke-width="5"/><path d="M222 135 L235 148 L260 120" fill="none" stroke="#132A2E" stroke-width="8" stroke-linecap="round"/></g>
</svg>
