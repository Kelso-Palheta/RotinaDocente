<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Linha do tempo completa concluída">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1810"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0% { transform: scale(0.88); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><line x1="75" y1="135" x2="405" y2="135" stroke="#FDE047" stroke-width="8"/><circle cx="105" cy="135" r="22" fill="#FB923C"/><circle cx="195" cy="135" r="22" fill="#FDE047"/><circle cx="285" cy="135" r="22" fill="#FB923C"/><circle cx="375" cy="135" r="26" fill="#FFFFFF"/></g>
</svg>
