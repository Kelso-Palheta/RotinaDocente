<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Colunas prontas para conectar conceitos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132A2E"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      .cena-mov { transform-origin: 240px 135px; animation: none; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="85" y="65" width="110" height="44" rx="10" fill="#0D9488" stroke="#2DD4BF" stroke-width="3"/><rect x="85" y="155" width="110" height="44" rx="10" fill="#0D9488" stroke="#FACC15" stroke-width="3"/><rect x="285" y="65" width="110" height="44" rx="10" fill="#0D9488" stroke="#FACC15" stroke-width="3"/><rect x="285" y="155" width="110" height="44" rx="10" fill="#0D9488" stroke="#2DD4BF" stroke-width="3"/></g>
</svg>
