<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Conexões cruzadas para revisar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132A2E"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: rotate(0deg); } 35% { transform: rotate(-2.5deg); } 70% { transform: rotate(2.5deg); } }
      .cena-mov { transform-origin: 240px 135px; animation: none; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><circle cx="130" cy="85" r="22" fill="#2DD4BF"/><circle cx="130" cy="185" r="22" fill="#FACC15"/><circle cx="350" cy="85" r="22" fill="#FACC15"/><circle cx="350" cy="185" r="22" fill="#2DD4BF"/><line x1="152" y1="85" x2="328" y2="185" stroke="#FCA5A5" stroke-width="5"/><line x1="152" y1="185" x2="328" y2="85" stroke="#FCA5A5" stroke-width="5"/></g>
</svg>
