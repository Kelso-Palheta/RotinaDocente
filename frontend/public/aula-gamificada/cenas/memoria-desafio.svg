<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Tabuleiro de cartas prontas para virar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="105" y="55" width="75" height="75" rx="10" fill="#0EA5E9" stroke="#38BDF8" stroke-width="3"/><rect x="202" y="55" width="75" height="75" rx="10" fill="#0EA5E9" stroke="#FDE047" stroke-width="3"/><rect x="300" y="55" width="75" height="75" rx="10" fill="#0EA5E9" stroke="#38BDF8" stroke-width="3"/><rect x="105" y="145" width="75" height="75" rx="10" fill="#0EA5E9" stroke="#FDE047" stroke-width="3"/><rect x="202" y="145" width="75" height="75" rx="10" fill="#FDE047"/><rect x="300" y="145" width="75" height="75" rx="10" fill="#0EA5E9" stroke="#38BDF8" stroke-width="3"/></g>
</svg>
