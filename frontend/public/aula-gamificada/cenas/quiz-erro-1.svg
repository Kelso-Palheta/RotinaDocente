<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Lupa analisando pista do quiz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1145"/>
      <stop offset="100%" stop-color="#6315D9" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: rotate(0deg); } 35% { transform: rotate(-2.5deg); } 70% { transform: rotate(2.5deg); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><circle cx="215" cy="125" r="56" fill="#1E1145" stroke="#00DDEB" stroke-width="8"/><line x1="256" y1="166" x2="315" y2="225" stroke="#FFDF00" stroke-width="14" stroke-linecap="round"/><text x="215" y="142" text-anchor="middle" font-size="44" font-weight="900" fill="#FFDF00" font-family="sans-serif">!</text></g>
</svg>
