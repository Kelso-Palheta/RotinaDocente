<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Constelação completa de conceitos conectados">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132A2E"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0% { transform: scale(0.88); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><line x1="115" y1="170" x2="195" y2="80" stroke="#2DD4BF" stroke-width="5"/><line x1="195" y1="80" x2="295" y2="115" stroke="#2DD4BF" stroke-width="5"/><line x1="295" y1="115" x2="375" y2="65" stroke="#2DD4BF" stroke-width="5"/><circle cx="115" cy="170" r="16" fill="#FACC15"/><circle cx="195" cy="80" r="18" fill="#FACC15"/><circle cx="295" cy="115" r="16" fill="#FACC15"/><circle cx="375" cy="65" r="20" fill="#FFFFFF"/></g>
</svg>
