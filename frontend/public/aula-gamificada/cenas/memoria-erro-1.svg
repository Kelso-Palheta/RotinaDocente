<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Cartas diferentes retornando à mesa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: rotate(0deg); } 35% { transform: rotate(-2.5deg); } 70% { transform: rotate(2.5deg); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="120" y="75" width="90" height="120" rx="12" fill="#0EA5E9" stroke="#38BDF8" stroke-width="4" transform="rotate(-6 165 135)"/><rect x="270" y="75" width="90" height="120" rx="12" fill="#0EA5E9" stroke="#FDE047" stroke-width="4" transform="rotate(6 315 135)"/><line x1="220" y1="115" x2="260" y2="155" stroke="#FCA5A5" stroke-width="7" stroke-linecap="round"/><line x1="260" y1="115" x2="220" y2="155" stroke="#FCA5A5" stroke-width="7" stroke-linecap="round"/></g>
</svg>
