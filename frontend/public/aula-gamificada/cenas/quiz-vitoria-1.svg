<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Pódio iluminado com confetes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1145"/>
      <stop offset="100%" stop-color="#6315D9" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0% { transform: scale(0.88); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="90" y="160" width="85" height="80" rx="8" fill="#6315D9"/><rect x="195" y="115" width="90" height="125" rx="8" fill="#FFDF00"/><rect x="305" y="145" width="85" height="95" rx="8" fill="#00DDEB"/><circle cx="140" cy="70" r="9" fill="#FFDF00"/><circle cx="340" cy="60" r="11" fill="#00DDEB"/><circle cx="240" cy="50" r="12" fill="#FFFFFF"/></g>
</svg>
