<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Mosaico completo de pares encontrados">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0% { transform: scale(0.88); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="90" y="55" width="68" height="72" rx="8" fill="#FDE047"/><rect x="170" y="55" width="68" height="72" rx="8" fill="#38BDF8"/><rect x="250" y="55" width="68" height="72" rx="8" fill="#FDE047"/><rect x="330" y="55" width="68" height="72" rx="8" fill="#38BDF8"/><rect x="90" y="142" width="68" height="72" rx="8" fill="#38BDF8"/><rect x="170" y="142" width="68" height="72" rx="8" fill="#FDE047"/><rect x="250" y="142" width="68" height="72" rx="8" fill="#38BDF8"/><rect x="330" y="142" width="68" height="72" rx="8" fill="#FDE047"/></g>
</svg>
