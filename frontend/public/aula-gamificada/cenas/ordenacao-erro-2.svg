<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Alavanca de ajuste fino de sequência">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1810"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><line x1="120" y1="95" x2="360" y2="95" stroke="#FB923C" stroke-width="8" stroke-linecap="round"/><circle cx="290" cy="95" r="16" fill="#FDE047"/><line x1="120" y1="170" x2="360" y2="170" stroke="#EA580C" stroke-width="8" stroke-linecap="round"/><circle cx="185" cy="170" r="16" fill="#FCA5A5"/></g>
</svg>
