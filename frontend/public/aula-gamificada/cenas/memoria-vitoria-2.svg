<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Medalha de memória completa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><polygon points="190,40 240,120 290,40 265,40 240,85 215,40" fill="#38BDF8"/><circle cx="240" cy="155" r="62" fill="#FDE047" stroke="#FFFFFF" stroke-width="6"/><polygon points="240,115 251,142 280,142 257,158 265,186 240,170 215,186 223,158 200,142 229,142" fill="#0F2942"/></g>
</svg>
