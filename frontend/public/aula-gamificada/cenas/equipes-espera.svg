<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Arena cooperativa aguardando times">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#271033"/>
      <stop offset="100%" stop-color="#DB2777" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      .cena-mov { transform-origin: 240px 135px; animation: anim 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><circle cx="155" cy="135" r="46" fill="#DB2777" stroke="#38BDF8" stroke-width="5"/><circle cx="325" cy="135" r="46" fill="#38BDF8" stroke="#FACC15" stroke-width="5"/><text x="240" y="148" text-anchor="middle" font-size="34" font-weight="900" fill="#FACC15" font-family="sans-serif">VS</text></g>
</svg>
