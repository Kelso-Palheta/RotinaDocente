<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Bandeiras erguidas pela equipe vencedora">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#271033"/>
      <stop offset="100%" stop-color="#DB2777" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0% { transform: scale(0.88); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
      .cena-mov { transform-origin: 240px 135px; animation: none; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><line x1="155" y1="65" x2="155" y2="225" stroke="#FFFFFF" stroke-width="6"/><polygon points="155,65 245,95 155,125" fill="#FACC15"/><line x1="275" y1="80" x2="275" y2="225" stroke="#FFFFFF" stroke-width="6"/><polygon points="275,80 355,108 275,135" fill="#38BDF8"/></g>
</svg>
