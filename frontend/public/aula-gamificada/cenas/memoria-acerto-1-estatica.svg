<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Par de cartas revelado com brilho">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.45"/>
    </linearGradient>
    <style>
      @keyframes anim { 0% { transform: scale(0.88); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
      .cena-mov { transform-origin: 240px 135px; animation: none; }
      @media (prefers-reduced-motion: reduce) { .cena-mov { animation: none; } }
    </style>
  </defs>
  <rect width="480" height="270" rx="20" fill="url(#bg)"/>
  <g class="cena-mov"><rect x="120" y="70" width="95" height="130" rx="12" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/><rect x="265" y="70" width="95" height="130" rx="12" fill="#FDE047" stroke="#FFFFFF" stroke-width="4"/><path d="M215 135 H265" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="6 4"/><circle cx="240" cy="135" r="14" fill="#FFFFFF"/></g>
</svg>
