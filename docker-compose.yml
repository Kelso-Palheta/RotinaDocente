version: '3.8'

services:
  # 1. Reverse Proxy & SSL (Nginx)
  nginx:
    image: nginx:alpine
    container_name: gestaodocente_nginx
    restart: always
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/staticfiles:/var/www/static:ro
      - ./backend/media:/var/www/media:ro
    depends_on:
      - django_api
      - nextjs_frontend

  # 2. Backend Django REST Framework (Core API)
  django_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestaodocente_api
    restart: always
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_DEBUG=False
      - DB_ENGINE=mysql
      - MYSQL_DATABASE=gestaodocente_db
      - MYSQL_USER=gestaodocente_user
      - MYSQL_PASSWORD=gestaodocente_secure_pass_2026
      - MYSQL_HOST=mysql_db
      - MYSQL_PORT=3306
      - REDIS_URL=redis://redis_broker:6379/0
      - DJANGO_ALLOWED_HOSTS=*
    depends_on:
      mysql_db:
        condition: service_healthy
      redis_broker:
        condition: service_started

  # 3. Celery Worker (OpenCV & Tarefas de IA em Segundo Plano)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestaodocente_celery
    restart: always
    entrypoint: ["celery", "-A", "core", "worker", "-l", "info", "--concurrency=4"]
    volumes:
      - ./backend:/app
    environment:
      - DB_ENGINE=mysql
      - MYSQL_DATABASE=gestaodocente_db
      - MYSQL_USER=gestaodocente_user
      - MYSQL_PASSWORD=gestaodocente_secure_pass_2026
      - MYSQL_HOST=mysql_db
      - MYSQL_PORT=3306
      - REDIS_URL=redis://redis_broker:6379/0
    depends_on:
      - redis_broker
      - mysql_db

  # 4. Frontend Next.js 16 (App Router)
  nextjs_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestaodocente_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://django_api:8000
    depends_on:
      - django_api

  # 5. Banco de Dados MySQL 8.0
  mysql_db:
    image: mysql:8.0
    container_name: gestaodocente_mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=gestaodocente_root_pass_2026
      - MYSQL_DATABASE=gestaodocente_db
      - MYSQL_USER=gestaodocente_user
      - MYSQL_PASSWORD=gestaodocente_secure_pass_2026
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. Redis Broker & Cache
  redis_broker:
    image: redis:7-alpine
    container_name: gestaodocente_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
